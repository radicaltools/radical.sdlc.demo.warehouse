<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 460" role="img" aria-label="An operator records deliveries in the stock service. The Shop reserves goods, all of a reservation or none, and is told what is short. To send them it asks the dispatch service, which books the carrier once per key and has the stock service take the goods off the shelf."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-person" x="0" y="0" width="1224" height="92"/><text class="lane-name" x="14" y="50.0">Operator</text><rect class="lane lane-auto" x="0" y="92" width="1224" height="92"/><text class="lane-name" x="14" y="142.0">Shop</text><line class="rule" x1="0" y1="92" x2="1224" y2="92"/><rect class="lane lane-auto" x="0" y="184" width="1224" height="92"/><text class="lane-name" x="14" y="234.0">Stock service</text><line class="rule" x1="0" y1="184" x2="1224" y2="184"/><rect class="lane lane-auto" x="0" y="276" width="1224" height="92"/><text class="lane-name" x="14" y="326.0">Dispatch service</text><line class="rule" x1="0" y1="276" x2="1224" y2="276"/><rect class="lane lane-auto" x="0" y="368" width="1224" height="92"/><text class="lane-name" x="14" y="418.0">Carrier</text><line class="rule" x1="0" y1="368" x2="1224" y2="368"/><rect class="box box-person" x="104" y="12" width="122" height="68" rx="4"/><text class="title" x="165" y="42.5">Records a delivery</text><text class="tag" x="165" y="57.5">/stock/receipts</text><rect class="box box-auto" x="244" y="196" width="122" height="68" rx="4"/><text class="title" x="305" y="226.5">Adds to on hand</text><text class="tag" x="305" y="241.5">stock ledger</text><rect class="box box-auto" x="384" y="104" width="122" height="68" rx="4"/><text class="title" x="445" y="134.5">Pays an order</text><text class="tag" x="445" y="149.5">Idempotency-Key</text><rect class="box box-auto" x="524" y="196" width="122" height="68" rx="4"/><text class="title" x="585" y="226.5">Holds all or none</text><text class="tag" x="585" y="241.5">never below zero</text><rect class="box box-auto" x="524" y="104" width="122" height="68" rx="4"/><text class="title" x="585" y="134.5">Told what is short</text><text class="tag" x="585" y="149.5">409, nothing held</text><rect class="box box-auto" x="664" y="104" width="122" height="68" rx="4"/><text class="title" x="725" y="134.5">Ships the order</text><text class="tag" x="725" y="149.5">Idempotency-Key</text><rect class="box box-auto" x="804" y="288" width="122" height="68" rx="4"/><text class="title" x="865" y="318.5">Books the carrier</text><text class="tag" x="865" y="333.5">once per key</text><rect class="box box-auto" x="804" y="380" width="122" height="68" rx="4"/><text class="title" x="865" y="410.5">Takes the parcel</text><text class="tag" x="865" y="425.5">another company</text><rect class="box box-auto" x="944" y="196" width="122" height="68" rx="4"/><text class="title" x="1005" y="219">Takes the goods</text><text class="title" x="1005" y="234">off the shelf</text><text class="tag" x="1005" y="249">on hand, held</text><rect class="box box-auto" x="1084" y="104" width="122" height="68" rx="4"/><text class="title" x="1145" y="134.5">Has the</text><text class="title" x="1145" y="149.5">tracking number</text><path class="flow " d="M165 80V230H244" marker-end="url(#a)"/><path class="flow " d="M445 172V230H524" marker-end="url(#a)"/><path class="flow bad" d="M585 196V172" marker-end="url(#a-bad)"/><path class="flow " d="M646 230H725V172" marker-end="url(#a)"/><text class="note " x="731" y="194" text-anchor="start">held</text><path class="flow " d="M786 138H865V288" marker-end="url(#a)"/><path class="flow " d="M865 356V380" marker-end="url(#a)"/><text class="note bad" x="871" y="378" text-anchor="start">down: 503, stays held</text><path class="flow " d="M926 322H1005V264" marker-end="url(#a)"/><text class="note " x="1011" y="286" text-anchor="start">booked</text><path class="flow " d="M1066 230H1145V172" marker-end="url(#a)"/></svg>
