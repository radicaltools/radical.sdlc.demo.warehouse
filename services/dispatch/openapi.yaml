openapi: 3.1.0
info:
  title: Dispatch service
  version: 1.5.0
  description: Books the carrier for a held reservation, and reads the carrier's status of a dispatched one. Part of the Warehouse.
paths:
  /dispatches/{reservationId}:
    get:
      summary: Reads the carrier's status of a dispatched reservation; changes nothing
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The tracking number, the estimated delivery date and the carrier's status of its delivery
          content:
            application/json:
              schema:
                type: object
                required: [reservationId, trackingNumber, estimatedDeliveryDate, status, deliveredAt]
                properties:
                  reservationId: { type: string }
                  trackingNumber: { type: string }
                  estimatedDeliveryDate: { type: [string, 'null'], format: date, description: "The date the carrier gave when it booked the parcel, as it gave it; null when it gave none" }
                  status: { type: string, enum: [in-transit, out-for-delivery, delivered, lost] }
                  deliveredAt: { type: [string, 'null'], format: date-time, description: "The date and time the carrier reports the parcel was delivered, as it gave it, like 2026-11-21T10:30:00Z; null when the status is not delivered or the carrier gave no time for a delivered one" }
        '404': { description: No such reservation, or it has not been dispatched }
        '503': { description: The carrier cannot be asked for the status, for instance after a restart of the dispatch service; the reservation stays as it is }
  /dispatches:
    post:
      summary: Books the carrier and takes the goods off the shelf
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId]
              properties:
                reservationId: { type: string }
                deliveryAddress:
                  type: object
                  description: "The address the parcel goes to, as the Shop gives it; optional, and a dispatch without it books the carrier without one"
                  required: [street, city, postalCode, country]
                  properties:
                    street: { type: string }
                    city: { type: string }
                    postalCode: { type: string }
                    country: { type: string, description: "The country as the Shop gave it, passed on to the carrier unchecked; a two-letter code such as PL" }
      responses:
        '201':
          description: The tracking number and the estimated delivery date, the same ones for a key already seen
          content:
            application/json:
              schema:
                type: object
                required: [reservationId, trackingNumber, estimatedDeliveryDate]
                properties:
                  reservationId: { type: string }
                  trackingNumber: { type: string }
                  estimatedDeliveryDate: { type: [string, 'null'], format: date, description: "The date the carrier gave when it booked the parcel, as it gave it; null when it gave none" }
        '400': { description: No key, or no reservationId }
        '404': { description: No such reservation }
        '409': { description: The reservation is not held }
        '503': { description: The carrier or the stock service cannot be reached; the reservation stays held }
